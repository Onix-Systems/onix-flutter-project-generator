#@formatter:off
name: {{project_name}}
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
#  flutter_test:
#    sdk: flutter

flutter:
  uses-material-design: true
  {{#handLocalization}}generate: true{{/handLocalization}}

    # To add assets to your application, add an assets section, like this:
  assets:
    - assets/launcher_icons/
    #   - images/a_dot_ham.jpeg


    # To add custom fonts to your application, add a fonts section here,
    # in this "flutter" section. Each entry in this list should have a
    # "family" key with the font family name, and a "fonts" key with a
    # list giving the asset and other descriptors for the font. For
    # example:
    # fonts:
    #   - family: Schyler
    #     fonts:
    #       - asset: fonts/Schyler-Regular.ttf
    #       - asset: fonts/Schyler-Italic.ttf
    #         style: italic
    #   - family: Trajan Pro
    #     fonts:
    #       - asset: fonts/TrajanPro.ttf
    #       - asset: fonts/TrajanPro_Bold.ttf
    #         weight: 700
    #
    # For details regarding fonts from package dependencies,
    # see https://flutter.dev/custom-fonts/#from-packages

#{flavorizer_injection_config}

{{^flavorizr}}
flutter_launcher_icons:
  image_path: "assets/launcher_icons/ic_launcher.png"
  android: {{genMobile}}
  ios: {{genMobile}}
  {{#genMobile}}remove_alpha_ios: true{{/genMobile}}
  {{#genWeb}}web:
    generate: true
    image_path: "assets/launcher_icons/ic_launcher.png"{{/genWeb}}
  {{#genWindows}}windows:
    generate: true
    image_path: "assets/launcher_icons/ic_launcher.png"{{/genWindows}}
  {{#genMacos}}macos:
    generate: true
    image_path: "assets/launcher_icons/ic_launcher.png"{{/genMacos}}
  {{#genLinux}}linux:
    generate: true
    image_path: "assets/launcher_icons/ic_launcher.png"{{/genLinux}}
{{/flavorizr}}

{{^handLocalization}}flutter_intl:
  enabled: true
  arb_dir: lib/app/localization/l10n
  output_dir: lib/app/localization/generated
  {{/handLocalization}}
