name: onix_flutter_bricks
description: Onix Flutter Clean Architecture

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.3.2+33

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.1
  window_manager: ^0.5.1
  recase: ^4.1.0
  process_run: ^1.2.4
  logger: ^2.6.2
  get_it: ^8.2.0
  file_selector: ^1.0.4
  msh_checkbox: ^2.0.1
  freezed_annotation: ^3.1.0
  flutter_bloc: ^9.1.1
  json_annotation: ^4.9.0
  collection: ^1.19.1
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  loader_overlay: ^5.0.0
  fluttertoast: ^9.0.0
  go_router: ^16.2.4
  intl: ^0.20.2
  intl_utils: ^2.8.12
  dropdown_button2: ^2.3.9
  searchfield: ^1.3.5
  google_fonts: ^6.3.2
  flutter_styled_toast: ^2.2.1
  gap: ^3.0.1
  onix_flutter_bloc:
    git:
      url: https://github.com/OnixFlutterTeam/onix-flutter-bloc.git
      ref: feature/mixins
  onix_flutter_core_models: ^0.0.3-beta.1
  onix_flutter_core: ^0.0.6-beta.4
  http: ^1.5.0
  auto_size_text: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.9.0
  freezed: ^3.2.3
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/platform_logo/
    - assets/documentation/
    - assets/signing/
    - assets/documentation/docs/
    - assets/documentation/docs/dev_solutions/
    - assets/fastlane/
    - assets/fastlane/android/
    - assets/fastlane/ios/
    - assets/git_cliff/

flutter_intl:
  enabled: true
  arb_dir: lib/app/localization/l10n
  output_dir: lib/app/localization/generated

